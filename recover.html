<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex" />
  <title>Mark — восстановление пароля</title>
  <link rel="stylesheet" href="css/app.css?v=1" />
  <link rel="icon" href="icons/icon-192.png?v=7" type="image/png" />
  <style>[hidden] { display: none !important; }</style>
</head>
<body>
  <main class="center-screen">
    <section class="card auth-card" aria-label="Восстановление пароля">
      <div class="brand"><img src="icons/icon-180.png?v=7" alt="" width="40" height="40" style="border-radius:10px">Mark</div>
      <h1 style="font-size:20px;text-align:center">Новый пароль</h1>
      <p class="form-msg" id="recovery-message" role="status">Проверяем ссылку…</p>
      <form id="recovery-form" hidden>
        <label class="field"><span>Новый пароль</span><input class="input" type="password" name="password" autocomplete="new-password" minlength="8" required /></label>
        <label class="field"><span>Повторите пароль</span><input class="input" type="password" name="confirmation" autocomplete="new-password" minlength="8" required /></label>
        <button type="submit" class="btn primary">Сохранить пароль</button>
      </form>
      <a class="link-btn" href="./">Открыть веб-версию Mark</a>
      <noscript>Для восстановления пароля включите JavaScript в браузере.</noscript>
    </section>
  </main>
  <script type="module" src="js/recovery-page.js"></script>
</body>
</html>
